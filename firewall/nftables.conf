
#!/usr/sbin/nft -f

table inet sentinelx {

    set blocked_ips {
        type ipv4_addr
    }

    chain forward {
        type filter hook forward priority 0;
        policy drop;

        iifname "ens37" ip saddr @blocked_ips drop

        iifname "ens37" oifname "ens38" accept

        iifname "ens38" oifname "ens37" ct state established,related accept
    }
}
